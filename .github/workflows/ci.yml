name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by upstream-sync.yml: PRs opened with GITHUB_TOKEN do not trigger pull_request.
  workflow_dispatch:

jobs:
  validate:
    name: Validate Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validation checks
        run: bash scripts/check.sh
